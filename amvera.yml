meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"

build:
  skip: false
  additionalCommands: npm run build
  artifacts:
    bot/*: /

run:
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: node dist/index.js
  persistenceMount: /data
  containerPort: "80"
  singleton: true
  zeroDowntime: false