openapi: 3.1.0
info:
  title: SmartCity API
  version: 0.1.0
  description: |
    API мини-приложения «Умный дом» (MAX): заявки жителей многоквартирного дома, подписи (поддержка),
    статусы и панель управляющей компании. Бот и API используют одну базу данных и одну бизнес-логику.

    **Авторизация.** Каждый запрос (кроме `/api/dictionaries` и `/health`) передаёт подписанный initData
    мини-приложения: `Authorization: MaxInitData <window.WebApp.initData>`. Сервер проверяет подпись
    HMAC-SHA256 по токену бота и находит/создаёт пользователя по его MAX id.
    В разработке (`DEV_AUTH_BYPASS=true`) вместо этого можно передать заголовок `X-Dev-User-Id: <maxUserId>`.
servers:
  - url: http://localhost:3000
    description: Локальный сервер
tags:
  - name: system
  - name: profile
  - name: catalogs
  - name: requests
  - name: announcements
    description: Создавать, редактировать и удалять могут только УК (любой дом) и председатель ТСЖ (свой дом)
  - name: news
    description: Создать может любой житель своего дома; изменить или удалить — автор или УК
  - name: cameras
    description: Только подтверждённым жителям своего дома; сотрудник УК — по houseId для любого дома
  - name: membership
    description: Рассмотрение заявок на вступление — сотрудник УК (любой дом) или председатель ТСЖ (свой дом)
  - name: uk
    description: Только для сотрудников УК (role = UK_EMPLOYEE)

components:
  securitySchemes:
    MaxInitData:
      type: apiKey
      in: header
      name: Authorization
      description: 'Формат: `MaxInitData <initData>`'
    DevUser:
      type: apiKey
      in: header
      name: X-Dev-User-Id
      description: Только при DEV_AUTH_BYPASS=true
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthorized, forbidden, not_found, conflict, validation_error, onboarding_required, apartment_not_found, building_not_found, membership_pending] }
            message: { type: string }
    RequestCategory:
      type: string
      enum: [NOISE, ELEVATOR, PLUMBING, ELECTRICITY, REPAIR, CLEANING, SECURITY, OTHER]
    RequestStatus:
      type: string
      enum: [VOTING, SUBMITTED, IN_PROGRESS, DELEGATED, RESOLVED, REJECTED, EXPIRED]
      description: |
        VOTING — на сборе подписей; SUBMITTED — передана в УК; IN_PROGRESS — решается;
        DELEGATED — передана в ответственную организацию; RESOLVED — сделано; REJECTED — отклонена;
        EXPIRED — срок сбора подписей истёк.
    RequestPriority:
      type: string
      enum: [NORMAL, EMERGENCY]
    ResidentType:
      type: string
      enum: [OWNER, TENANT]
    User:
      type: object
      properties:
        id: { type: integer }
        maxUserId: { type: string, description: MAX id пользователя (строка, т.к. BigInt) }
        role: { type: string, enum: [RESIDENT, UK_EMPLOYEE, CHAIRMAN], description: 'CHAIRMAN — председатель ТСЖ (назначается УК среди жителей дома)' }
        roleLabel: { type: string }
        firstName: { type: string }
        lastName: { type: [string, 'null'] }
        username: { type: [string, 'null'] }
        name: { type: string }
        house:
          type: [object, 'null']
          properties:
            id: { type: integer }
            address: { type: string }
            votePercent: { type: integer }
            lat: { type: [number, 'null'] }
            lng: { type: [number, 'null'] }
            apartmentsCount: { type: [integer, 'null'] }
        apartment: { type: [string, 'null'] }
        entrance: { type: [string, 'null'], description: Номер подъезда по квартире, если у дома известны диапазоны квартир по подъездам }
        residentType: { oneOf: [{ $ref: '#/components/schemas/ResidentType' }, { type: 'null' }] }
        residentTypeLabel: { type: [string, 'null'] }
        verifiedFullName: { type: [string, 'null'], description: ФИО, подтверждённое председателем ТСЖ или УК при одобрении заявки на вступление }
        onboarded: { type: boolean, description: Заявка на вступление подтверждена — доступны все функции бота и приложения }
        createdAt: { type: string, format: date-time }
        membership:
          description: Незавершённая заявка на вступление (пока onboarded = false); null, если ещё не подавалась или уже одобрена
          oneOf:
            - { type: 'null' }
            - type: object
              properties:
                id: { type: integer }
                houseId: { type: integer }
                houseAddress: { type: string }
                apartment: { type: string }
                fullName: { type: string }
                status: { type: string, enum: [PENDING, REJECTED] }
                rejectReason: { type: [string, 'null'] }
                createdAt: { type: string, format: date-time }
    Entrance:
      type: object
      description: Подъезд и диапазон квартир в нём
      properties:
        number: { type: string }
        from: { type: integer }
        to: { type: integer }
    House:
      type: object
      properties:
        id: { type: integer }
        address: { type: string }
        lat: { type: [number, 'null'], description: Координаты центра здания для маркера на карте }
        lng: { type: [number, 'null'] }
        apartmentsCount: { type: [integer, 'null'], description: Число квартир (null — неизвестно, номер квартиры не проверяется) }
        entrances: { type: array, items: { $ref: '#/components/schemas/Entrance' } }
        votePercent: { type: integer }
        dataSource: { type: [string, 'null'], description: 'osm — сведения из OpenStreetMap; null — введены вручную' }
        chatBound: { type: boolean, description: К дому привязан чат в MAX }
        residentsCount: { type: integer, description: Только в списке домов }
    Building:
      type: object
      description: Здание по точке на карте (OpenStreetMap)
      properties:
        externalId: { type: string, examples: ['osm:way/61424311'] }
        source: { type: string, enum: [osm] }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        apartmentsCount: { type: [integer, 'null'] }
        entrances: { type: array, items: { $ref: '#/components/schemas/Entrance' } }
    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        categories: { type: array, items: { $ref: '#/components/schemas/RequestCategory' } }
    Announcement:
      type: object
      description: Объявление УК или председателя ТСЖ жителям дома (например — об отключении горячей воды)
      properties:
        id: { type: integer }
        houseId: { type: integer }
        houseAddress: { type: string }
        title: { type: string }
        description: { type: string }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            role: { type: string, enum: [RESIDENT, UK_EMPLOYEE, CHAIRMAN] }
        photoUrls: { type: array, items: { type: string }, description: 'Ссылки на приложенные фото (относительные, /uploads/photos/…); добавляются только в боте' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateAnnouncement:
      type: object
      required: [title, description]
      properties:
        houseId: { type: integer, description: Обязателен для УК; председатель может не указывать — берётся его дом }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 2000 }
    UpdateAnnouncement:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 2000 }
    News:
      type: object
      description: Новость от жителя дома (не от УК) — например, приглашение в гости; обязателен контакт автора
      properties:
        id: { type: integer }
        houseId: { type: integer }
        houseAddress: { type: string }
        title: { type: string }
        description: { type: string }
        contact: { type: string, description: Как связаться с автором — телефон, ссылка на профиль и т.п. }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            role: { type: string, enum: [RESIDENT, UK_EMPLOYEE, CHAIRMAN] }
        isMine: { type: boolean }
        photoUrls: { type: array, items: { type: string }, description: 'Ссылки на приложенные фото (относительные, /uploads/photos/…)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateNews:
      type: object
      required: [title, description, contact]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 2000 }
        contact: { type: string, minLength: 3, maxLength: 200 }
    CreateNewsMultipart:
      allOf:
        - $ref: '#/components/schemas/CreateNews'
        - type: object
          properties:
            photos: { type: array, items: { type: string, format: binary }, maxItems: 5, description: До 5 файлов jpg/png/webp/gif, каждый до 8 МБ }
    UpdateNews:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 5, maxLength: 2000 }
        contact: { type: string, minLength: 3, maxLength: 200 }
    Resident:
      type: object
      description: Подтверждённый житель дома — только для сотрудников УК
      properties:
        id: { type: integer }
        maxUserId: { type: string, description: MAX id пользователя (строка, т.к. BigInt) }
        username: { type: [string, 'null'], description: Ник в MAX (без @) }
        apartment: { type: [string, 'null'] }
        fullName: { type: string, description: 'ФИО, подтверждённое при одобрении заявки на вступление, либо имя из профиля MAX' }
        verified: { type: boolean, description: true — ФИО подтверждено через заявку на вступление; false — это только имя из профиля MAX }
        role: { type: string, enum: [RESIDENT, CHAIRMAN] }
        residentType: { oneOf: [{ $ref: '#/components/schemas/ResidentType' }, { type: 'null' }] }
        residentTypeLabel: { type: [string, 'null'] }
    Camera:
      type: object
      description: |
        Камера дома (двор/подъезд) — раздел-заготовка под масштабирование. Реальных трансляций пока нет:
        streamUrl всегда null, пока в БД не проставят ссылку на конкретную камеру этого дома.
      properties:
        id: { type: integer }
        houseId: { type: integer }
        houseAddress: { type: string }
        label: { type: string, examples: ['Двор', 'Подъезд'] }
        streamUrl: { type: [string, 'null'], description: Ссылка на трансляцию; null — трансляция ещё не подключена }
    Request:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/RequestCategory' }
        categoryLabel: { type: string }
        priority: { $ref: '#/components/schemas/RequestPriority' }
        priorityLabel: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        statusLabel: { type: string }
        votesCount: { type: integer, description: Сколько подписей собрано }
        votesRequired: { type: integer, description: 'Сколько нужно (20% жителей дома, минимум 1; 0 для аварийных)' }
        deadline: { type: [string, 'null'], format: date-time, description: Срок сбора подписей }
        submittedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionNote: { type: [string, 'null'], description: 'Что именно было сделано — обязательно при закрытии заявки (status = RESOLVED); очищается при возврате (POST /reopen)' }
        resolvedByName: { type: [string, 'null'], description: 'ФИО ответственного за выполнение — обязательно при закрытии заявки; очищается при возврате' }
        reopenedAt: { type: [string, 'null'], format: date-time, description: 'Когда заявку вернул автор (POST /reopen) — заявку можно вернуть только один раз' }
        delegatedAt: { type: [string, 'null'], format: date-time }
        delegatedTo:
          type: [object, 'null']
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
        house:
          type: object
          properties:
            id: { type: integer }
            address: { type: string }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            apartment: { type: [string, 'null'] }
        isMine: { type: boolean }
        hasVoted: { type: boolean }
        canVote: { type: boolean, description: Текущий пользователь может поддержать заявку }
        photoUrls: { type: array, items: { type: string }, description: 'Фото проблемы, приложенные при создании заявки (относительные ссылки, /uploads/photos/…)' }
        resultPhotoUrls: { type: array, items: { type: string }, description: 'Фото результата работы, которые УК прикладывает при закрытии заявки (RESOLVED), в боте или в мини-приложении' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RequestDetailed:
      allOf:
        - $ref: '#/components/schemas/Request'
        - type: object
          properties:
            votes:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  createdAt: { type: string, format: date-time }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      apartment: { type: [string, 'null'] }
            statusHistory:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  oldStatus: { oneOf: [{ $ref: '#/components/schemas/RequestStatus' }, { type: 'null' }] }
                  oldStatusLabel: { type: [string, 'null'] }
                  newStatus: { $ref: '#/components/schemas/RequestStatus' }
                  newStatusLabel: { type: string }
                  comment: { type: [string, 'null'] }
                  changedAt: { type: string, format: date-time }
                  changedBy:
                    type: [object, 'null']
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      role: { type: string }
    CreateRequest:
      type: object
      required: [category, description]
      properties:
        category: { $ref: '#/components/schemas/RequestCategory' }
        description: { type: string, minLength: 5, maxLength: 2000 }
        title: { type: string, maxLength: 120, description: Если не задан — формируется из категории и описания }
        priority: { $ref: '#/components/schemas/RequestPriority' }
        deadline: { type: string, description: 'Срок сбора подписей: ISO 8601 или ДД.ММ.ГГГГ. По умолчанию +14 дней. Для аварийных игнорируется' }
    CreateRequestMultipart:
      allOf:
        - $ref: '#/components/schemas/CreateRequest'
        - type: object
          properties:
            photos: { type: array, items: { type: string, format: binary }, maxItems: 5, description: До 5 файлов jpg/png/webp/gif, каждый до 8 МБ }
    ChangeStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [IN_PROGRESS, DELEGATED, RESOLVED, REJECTED] }
        comment: { type: string, maxLength: 1000 }
        organizationId: { type: integer, description: Обязателен для DELEGATED }
        resolutionNote: { type: string, maxLength: 2000, description: Обязательно для RESOLVED — что именно было сделано }
        resolvedByName: { type: string, maxLength: 150, description: Обязательно для RESOLVED — ФИО ответственного за выполнение }
    ChangeStatusMultipart:
      allOf:
        - $ref: '#/components/schemas/ChangeStatus'
        - type: object
          properties:
            photos: { type: array, items: { type: string, format: binary }, maxItems: 5, description: 'До 5 файлов jpg/png/webp/gif, каждый до 8 МБ — фото результата, только для RESOLVED' }
    ReopenRequest:
      type: object
      required: [reason, photos]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000, description: Почему автор считает, что проблема не устранена }
        photos: { type: array, items: { type: string, format: binary }, minItems: 1, maxItems: 5, description: Обязательно хотя бы одно фото-подтверждение, до 5 файлов jpg/png/webp/gif по 8 МБ }
    SubmitMembership:
      type: object
      required: [houseId, apartment, fullName]
      description: |
        Заявка на вступление (только для собственника — координатора-жителя добавляет собственник командой
        /add_tenant в боте, не через этот эндпоинт). Номер квартиры проверяется по данным дома: он должен быть
        в пределах числа квартир и, если известны подъезды, попадать в диапазон одного из них — иначе 400
        с code = apartment_not_found. Дом переходит в статус ожидания подтверждения председателем ТСЖ (если он
        назначен для этого дома) или сотрудником УК; полный доступ появляется только после подтверждения.
      properties:
        houseId: { type: integer, description: 'Дом, выбранный на карте (POST /api/houses) или из списка' }
        apartment: { type: string, maxLength: 10, examples: ['27', '15а'] }
        fullName: { type: string, minLength: 3, maxLength: 150, description: ФИО заявителя — увидит проверяющий }
    MembershipRequest:
      type: object
      properties:
        id: { type: integer }
        houseId: { type: integer }
        houseAddress: { type: string }
        apartment: { type: string }
        fullName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectReason: { type: [string, 'null'] }
        applicant:
          type: object
          properties:
            id: { type: integer }
            maxUserId: { type: string }
            name: { type: string }
        reviewedBy:
          oneOf:
            - type: object
              properties: { id: { type: integer }, name: { type: string } }
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RejectMembership:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
  responses:
    Unauthorized:
      description: Нет или неверный initData
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Недостаточно прав
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Не найдено
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Действие недопустимо в текущем состоянии (уже подписано, сбор завершён, недопустимый переход статуса)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: 'Ошибка валидации или заявка на вступление ещё не подтверждена (code = onboarding_required)'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - MaxInitData: []
  - DevUser: []

paths:
  /health:
    get:
      tags: [system]
      security: []
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  bot: { type: string, enum: [polling, webhook, disabled] }
                  time: { type: string, format: date-time }

  /api/dictionaries:
    get:
      tags: [catalogs]
      security: []
      summary: Справочники категорий, статусов, приоритетов и допустимых переходов
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  statuses: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  priorities: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  residentTypes: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
                  transitions: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/RequestStatus' } } }

  /api/me:
    get:
      tags: [profile]
      summary: Текущий пользователь
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [profile]
      summary: Подать заявку на вступление (дом, квартира, ФИО)
      description: |
        Не даёт доступ сразу — создаёт заявку со статусом PENDING (см. User.membership) и отправляет её на
        подтверждение. 409 с code = membership_pending, если у заявителя уже есть заявка на рассмотрении.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitMembership' } } }
      responses:
        '202':
          description: Заявка принята и ждёт подтверждения
          content:
            application/json:
              schema:
                type: object
                properties:
                  membership:
                    type: object
                    description: То же, что User.membership, но без oneOf-обёртки с null
        '400': { description: 'Ошибка валидации или квартиры нет в доме (code = apartment_not_found)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Уже есть заявка на рассмотрении (code = membership_pending)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/houses:
    get:
      tags: [catalogs]
      summary: Список домов с координатами (маркеры на карте)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/House' } } } } }
    post:
      tags: [catalogs]
      summary: Житель выбрал дом на карте — вернуть его из базы или создать
      description: |
        По точке нажатия сервер находит здание в OpenStreetMap (адрес, число квартир, подъезды).
        Если такой дом уже есть в базе — возвращает его (200), иначе создаёт и привязывает к УК (201).
        Полученный id передаётся в `PATCH /api/me`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Point' } } }
      responses:
        '200': { description: Дом уже был в базе, content: { application/json: { schema: { $ref: '#/components/schemas/House' } } } }
        '201': { description: Дом создан, content: { application/json: { schema: { $ref: '#/components/schemas/House' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: В точке нет жилого дома с адресом (code = building_not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/houses/lookup:
    get:
      tags: [catalogs]
      summary: Здание по точке на карте (без сохранения) — для подтверждения адреса перед выбором
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  building: { $ref: '#/components/schemas/Building' }
                  house: { oneOf: [{ $ref: '#/components/schemas/House' }, { type: 'null' }], description: Дом из базы, если уже подключён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: В точке нет жилого дома с адресом (code = building_not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/company:
    get:
      tags: [catalogs]
      summary: Контакты управляющей компании
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: [object, 'null']
                properties:
                  id: { type: integer }
                  name: { type: string }
                  phone: { type: string }
                  email: { type: [string, 'null'] }
                  address: { type: [string, 'null'] }
                  workingHours: { type: [string, 'null'] }

  /api/organizations:
    get:
      tags: [catalogs]
      summary: Организации, в которые УК передаёт заявки
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } }

  /api/requests:
    get:
      tags: [requests]
      summary: Список заявок (житель — своего дома, сотрудник УК — всех домов)
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, mine, supported], default: all } }
        - { name: status, in: query, description: 'Статусы через запятую, например VOTING,SUBMITTED', schema: { type: string } }
        - { name: category, in: query, description: 'Категории через запятую, например PLUMBING,ELEVATOR', schema: { type: string } }
        - { name: houseId, in: query, description: Только для сотрудников УК, schema: { type: integer } }
        - { name: limit, in: query, description: 'По умолчанию 5 — для постраничной подгрузки «Показать ещё»', schema: { type: integer, default: 5, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Request' } }
                  total: { type: integer, description: Всего заявок по фильтру (для «Показано X из Y») }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [requests]
      summary: Создать заявку
      description: |
        Аварийная заявка (priority = EMERGENCY) сразу получает статус SUBMITTED и уходит в УК без подписей.
        Фото необязательны: до 5 штук, каждая до 8 МБ, форматы jpg/png/webp/gif — отправляются полем `photos`
        только в варианте `multipart/form-data` (JSON-запрос без фото работает как раньше).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateRequest' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/CreateRequestMultipart' } }
      responses:
        '201': { description: Создана, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [requests]
      summary: Заявка с подписями и историей статусов
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetailed' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [requests]
      summary: Удалить свою заявку (только пока идёт сбор подписей)
      responses:
        '204': { description: Удалена }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/requests/{id}/vote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [requests]
      summary: Поддержать заявку (подписать)
      description: При достижении порога заявка автоматически переходит в SUBMITTED; в ответе поле submitted = true.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Request'
                  - type: object
                    properties:
                      submitted: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [requests]
      summary: Отозвать подпись (пока идёт сбор)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/requests/{id}/reopen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [requests]
      summary: Вернуть закрытую заявку («не сделано») — только автор
      description: |
        Только автор заявки, только пока status = RESOLVED, только один раз на заявку и только в течение
        7 дней после закрытия (иначе 409, code = reopen_limit / reopen_window_expired). Обязательны reason
        (минимум 5 символов) и хотя бы одно фото, подтверждающее, что проблема не устранена. Заявка
        возвращается в статус SUBMITTED (без повторного сбора подписей), старые resolutionNote/resolvedByName
        и фото результата предыдущего закрытия очищаются. УК получает уведомление; при повторном закрытии
        этой же заявки фото результата уже обязательны (см. PATCH /status).
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ReopenRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Не в статусе RESOLVED, уже возвращалась (reopen_limit) или истёк срок 7 дней (reopen_window_expired)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/requests/{id}/document:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [requests]
      summary: Сформированный документ по заявке (текст) — автору и сотрудникам УК
      responses:
        '200': { description: OK, content: { text/plain: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/requests/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [uk]
      summary: Сменить статус заявки (сотрудник УК)
      description: |
        Допустимые переходы см. в `/api/dictionaries` → `transitions`. Для DELEGATED обязателен organizationId;
        в этом случае в организацию отправляется письмо с документом (без SMTP — имитация, отмечается в поле mail.simulated).
        Для RESOLVED обязательны resolutionNote (что сделано) и resolvedByName (ФИО ответственного); фото
        необязательны — отправляются полем `photos` только в варианте `multipart/form-data`.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ChangeStatus' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/ChangeStatusMultipart' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Request'
                  - type: object
                    properties:
                      mail:
                        type: object
                        properties:
                          simulated: { type: boolean }
                          to: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/uk/requests:
    get:
      tags: [uk]
      summary: Очередь УК (по умолчанию SUBMITTED, IN_PROGRESS, DELEGATED)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: category, in: query, description: 'Категории через запятую, например PLUMBING,ELEVATOR', schema: { type: string } }
        - { name: houseId, in: query, schema: { type: integer } }
        - { name: limit, in: query, description: 'По умолчанию 5 — для постраничной подгрузки «Показать ещё»', schema: { type: integer, default: 5, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Request' } }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/announcements:
    get:
      tags: [announcements]
      summary: Список объявлений (житель и председатель — своего дома, сотрудник УК — по houseId или все)
      parameters:
        - { name: houseId, in: query, description: Только для сотрудников УК, schema: { type: integer } }
        - { name: limit, in: query, description: 'По умолчанию 5 — для постраничной подгрузки «Показать ещё»', schema: { type: integer, default: 5, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [announcements]
      summary: Опубликовать объявление
      description: |
        Сотрудник УК указывает houseId (любой дом). Председатель ТСЖ houseId может не указывать —
        объявление публикуется в его доме; указать чужой дом ему запрещено. Житель без роли — 403.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAnnouncement' } } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/Announcement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/announcements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [announcements]
      summary: Изменить объявление (УК или председатель ТСЖ своего дома)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAnnouncement' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Announcement' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [announcements]
      summary: Удалить объявление (УК или председатель ТСЖ своего дома)
      responses:
        '204': { description: Удалено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/news:
    get:
      tags: [news]
      summary: Список новостей дома (житель — своего дома, сотрудник УК — по houseId или все)
      parameters:
        - { name: houseId, in: query, description: Только для сотрудников УК, schema: { type: integer } }
        - { name: limit, in: query, description: 'По умолчанию 5 — для постраничной подгрузки «Показать ещё»', schema: { type: integer, default: 5, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/News' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [news]
      summary: Опубликовать новость в своём доме
      description: |
        Может любой прописанный к дому житель. houseId брать не нужно — берётся дом автора.
        Фото необязательны: до 5 штук, каждая до 8 МБ, форматы jpg/png/webp/gif — отправляются полем `photos`
        только в варианте `multipart/form-data` (JSON-запрос без фото работает как раньше).
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateNews' } }
          multipart/form-data: { schema: { $ref: '#/components/schemas/CreateNewsMultipart' } }
      responses:
        '201': { description: Создано, content: { application/json: { schema: { $ref: '#/components/schemas/News' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/news/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [news]
      summary: Изменить новость (автор или сотрудник УК)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateNews' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/News' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [news]
      summary: Удалить новость (автор или сотрудник УК)
      responses:
        '204': { description: Удалено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/residents:
    get:
      tags: [uk]
      summary: Подтверждённые жители дома (только для сотрудников УК)
      parameters:
        - { name: houseId, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Resident' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/cameras:
    get:
      tags: [cameras]
      summary: Камеры дома (двор, подъезд) — заготовка под будущие трансляции
      description: |
        Житель/председатель — только свой дом (без houseId, доступно после подтверждения заявки на
        вступление). Сотрудник УК — обязательный houseId, любой дом.
      parameters:
        - { name: houseId, in: query, description: Обязателен для сотрудников УК, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Camera' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/membership/requests:
    get:
      tags: [membership]
      summary: Очередь заявок на вступление (сотрудник УК — все дома, председатель ТСЖ — свой дом)
      description: То же, что команда бота /membership_queue, но с постраничной подгрузкой для мини-приложения.
      parameters:
        - { name: limit, in: query, description: 'По умолчанию 5 — для постраничной подгрузки «Показать ещё»', schema: { type: integer, default: 5, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MembershipRequest' } }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/membership/requests/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [membership]
      summary: Подтвердить заявку на вступление
      description: Заявителю открывается полный доступ и отправляется приглашение в чат дома (в боте).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/membership/requests/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [membership]
      summary: Отклонить заявку на вступление
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RejectMembership' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
