schemaVersion: "1.0"
solution:
  name: "SmartCity API"
  teamId: "171"
api:
  baseUrl: "https://smartcity.visitly.ru"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Проверка живости сервиса"
    method: "GET"
    path: "/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status", "bot", "time"]
    timeoutMs: 5000
    repeatable: true

  - id: "get-dictionaries"
    name: "Получение справочников"
    method: "GET"
    path: "/api/dictionaries"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["categories", "statuses", "priorities", "residentTypes", "transitions"]
    timeoutMs: 5000
    repeatable: true
    extract:
      categories: "$.categories"
      statuses: "$.statuses"
      priorities: "$.priorities"

  - id: "get-profile"
    name: "Профиль пользователя"
    method: "GET"
    path: "/api/me"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "name", "onboarded"]
    timeoutMs: 5000
    repeatable: true
    extract:
      userId: "$.id"
      activeHouseId: "$.house.id"
    dependsOn: ["get-dictionaries"]

  - id: "get-user-houses"
    name: "Список домов пользователя"
    method: "GET"
    path: "/api/me/houses"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["items"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "submit-membership"
    name: "Заявка на вступление в дом"
    method: "PATCH"
    path: "/api/me"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        houseId: 1
        apartment: "27"
        fullName: "Иванов Иван"
    expected:
      statusCodes: [202, 400, 404, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "set-active-house"
    name: "Переключение активного дома"
    method: "PUT"
    path: "/api/me/active-house"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        houseId: 1
    expected:
      statusCodes: [200, 403, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "leave-house"
    name: "Покинуть дом"
    method: "DELETE"
    path: "/api/me/houses/{houseId}"
    role: "user"
    request:
      path:
        houseId: 1
    expected:
      statusCodes: [200, 404, 409]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-user-houses"]

  - id: "get-houses"
    name: "Справочник домов"
    method: "GET"
    path: "/api/houses"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "houses-lookup"
    name: "Поиск здания по координатам"
    method: "GET"
    path: "/api/houses/lookup"
    role: "user"
    request:
      query:
        lat: 55.751244
        lng: 37.618423
    expected:
      statusCodes: [200, 400, 404]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "create-house"
    name: "Создание дома по координатам"
    method: "POST"
    path: "/api/houses"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        lat: 55.751244
        lng: 37.618423
    expected:
      statusCodes: [200, 201, 400, 404]
      contentType: "application/json"
      requiredFields: ["id", "address"]
    timeoutMs: 5000
    repeatable: false
    extract:
      houseId: "$.id"
    dependsOn: ["get-profile"]

  - id: "get-company"
    name: "Информация об УК"
    method: "GET"
    path: "/api/company"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "get-organizations"
    name: "Список организаций"
    method: "GET"
    path: "/api/organizations"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "get-requests-list"
    name: "Список заявок"
    method: "GET"
    path: "/api/requests"
    role: "user"
    request:
      query:
        filter: "all"
        limit: 5
        offset: 0
    expected:
      statusCodes: [200, 400]
      contentType: "application/json"
      requiredFields: ["items", "total"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "create-request"
    name: "Создание заявки"
    method: "POST"
    path: "/api/requests"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        category: "PLUMBING"
        description: "Тестовая заявка для проверки API"
        title: "Проверка API"
    expected:
      statusCodes: [201, 400, 403]
      contentType: "application/json"
      requiredFields: ["id", "title", "status"]
    timeoutMs: 5000
    repeatable: false
    extract:
      requestId: "$.id"
    dependsOn: ["get-profile"]

  - id: "get-request"
    name: "Получение заявки"
    method: "GET"
    path: "/api/requests/{id}"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200, 403, 404]
      contentType: "application/json"
      requiredFields: ["id", "title", "status", "votesCount"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["create-request"]

  - id: "vote-request"
    name: "Поддержка заявки"
    method: "POST"
    path: "/api/requests/{id}/vote"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200, 400, 403, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-request"]

  - id: "unvote-request"
    name: "Отзыв подписи"
    method: "DELETE"
    path: "/api/requests/{id}/vote"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["vote-request"]

  - id: "get-request-document"
    name: "Документ по заявке"
    method: "GET"
    path: "/api/requests/{id}/document"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200, 403, 404]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-request"]

  - id: "rate-request"
    name: "Оценка работы УК"
    method: "POST"
    path: "/api/requests/{id}/rate"
    role: "user"
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        rating: 5
    expected:
      statusCodes: [200, 400, 403, 404, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-request"]

  - id: "reopen-request"
    name: "Возврат закрытой заявки"
    method: "POST"
    path: "/api/requests/{id}/reopen"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [200, 400, 403, 404, 409]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-request"]

  - id: "delete-request"
    name: "Удаление заявки"
    method: "DELETE"
    path: "/api/requests/{id}"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [204, 403, 404, 409]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-request"]

  - id: "get-announcements"
    name: "Список объявлений"
    method: "GET"
    path: "/api/announcements"
    role: "user"
    request:
      query:
        limit: 5
        offset: 0
    expected:
      statusCodes: [200, 400]
      contentType: "application/json"
      requiredFields: ["items", "total"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "create-announcement"
    name: "Создание объявления"
    method: "POST"
    path: "/api/announcements"
    role: "uk"
    request:
      headers:
        Content-Type: "application/json"
      body:
        title: "Тестовое объявление"
        description: "Объявление для проверки API"
    expected:
      statusCodes: [201, 400, 403]
      contentType: "application/json"
      requiredFields: ["id", "title"]
    timeoutMs: 5000
    repeatable: false
    extract:
      announcementId: "$.id"
    dependsOn: ["get-profile"]

  - id: "patch-announcement"
    name: "Изменение объявления"
    method: "PATCH"
    path: "/api/announcements/{id}"
    role: "uk"
    request:
      path:
        id: "${announcementId}"
      headers:
        Content-Type: "application/json"
      body:
        title: "Обновлённое объявление"
    expected:
      statusCodes: [200, 400, 403, 404]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["create-announcement"]

  - id: "delete-announcement"
    name: "Удаление объявления"
    method: "DELETE"
    path: "/api/announcements/{id}"
    role: "uk"
    request:
      path:
        id: "${announcementId}"
    expected:
      statusCodes: [204, 403, 404]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["patch-announcement"]

  - id: "get-news"
    name: "Список новостей"
    method: "GET"
    path: "/api/news"
    role: "user"
    request:
      query:
        limit: 5
        offset: 0
    expected:
      statusCodes: [200, 400]
      contentType: "application/json"
      requiredFields: ["items", "total"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "create-news"
    name: "Создание новости"
    method: "POST"
    path: "/api/news"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        title: "Тестовая новость"
        description: "Новость для проверки API"
        contact: "+79001234567"
    expected:
      statusCodes: [201, 400]
      contentType: "application/json"
      requiredFields: ["id", "title"]
    timeoutMs: 5000
    repeatable: false
    extract:
      newsId: "$.id"
    dependsOn: ["get-profile"]

  - id: "patch-news"
    name: "Изменение новости"
    method: "PATCH"
    path: "/api/news/{id}"
    role: "user"
    request:
      path:
        id: "${newsId}"
      headers:
        Content-Type: "application/json"
      body:
        title: "Обновлённая новость"
    expected:
      statusCodes: [200, 400, 403, 404]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["create-news"]

  - id: "delete-news"
    name: "Удаление новости"
    method: "DELETE"
    path: "/api/news/{id}"
    role: "user"
    request:
      path:
        id: "${newsId}"
    expected:
      statusCodes: [204, 403, 404]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["patch-news"]

  - id: "get-cameras"
    name: "Камеры дома"
    method: "GET"
    path: "/api/cameras"
    role: "user"
    expected:
      statusCodes: [200, 400]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "get-uk-requests"
    name: "Очередь заявок УК"
    method: "GET"
    path: "/api/uk/requests"
    role: "uk"
    request:
      query:
        limit: 5
        offset: 0
    expected:
      statusCodes: [200, 403]
      contentType: "application/json"
      requiredFields: ["items", "total"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "patch-request-status"
    name: "Смена статуса заявки"
    method: "PATCH"
    path: "/api/requests/{id}/status"
    role: "uk"
    request:
      path:
        id: "${requestId}"
      headers:
        Content-Type: "application/json"
      body:
        status: "IN_PROGRESS"
    expected:
      statusCodes: [200, 400, 403, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-request"]

  - id: "patch-house"
    name: "Изменение порога подписей дома"
    method: "PATCH"
    path: "/api/houses/{id}"
    role: "uk"
    request:
      path:
        id: "${houseId}"
      headers:
        Content-Type: "application/json"
      body:
        votePercent: 25
    expected:
      statusCodes: [200, 400, 403, 404]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["create-house"]

  - id: "delete-house"
    name: "Удаление дома"
    method: "DELETE"
    path: "/api/houses/{id}"
    role: "uk"
    request:
      path:
        id: 999
    expected:
      statusCodes: [204, 403, 404, 409]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "appoint-chairman"
    name: "Назначение председателя ТСЖ"
    method: "PUT"
    path: "/api/houses/{id}/chairman"
    role: "uk"
    request:
      path:
        id: 1
      headers:
        Content-Type: "application/json"
      body:
        userId: 1
    expected:
      statusCodes: [200, 400, 403, 404]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "dismiss-chairman"
    name: "Снятие председателя ТСЖ"
    method: "DELETE"
    path: "/api/houses/{id}/chairman"
    role: "uk"
    request:
      path:
        id: 1
    expected:
      statusCodes: [200, 403, 404]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "remove-resident"
    name: "Удаление жителя из дома"
    method: "DELETE"
    path: "/api/houses/{id}/residents/{userId}"
    role: "uk"
    request:
      path:
        id: 1
        userId: 1
    expected:
      statusCodes: [200, 403, 404]
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-profile"]

  - id: "get-residents"
    name: "Подтверждённые жители дома"
    method: "GET"
    path: "/api/residents"
    role: "uk"
    request:
      query:
        houseId: 1
    expected:
      statusCodes: [200, 400, 403]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "get-membership-requests"
    name: "Очередь заявок на вступление"
    method: "GET"
    path: "/api/membership/requests"
    role: "uk"
    request:
      query:
        limit: 5
        offset: 0
    expected:
      statusCodes: [200, 403]
      contentType: "application/json"
      requiredFields: ["items", "total"]
    timeoutMs: 5000
    repeatable: true
    dependsOn: ["get-profile"]

  - id: "approve-membership"
    name: "Подтверждение заявки на вступление"
    method: "POST"
    path: "/api/membership/requests/{id}/approve"
    role: "uk"
    request:
      path:
        id: 1
    expected:
      statusCodes: [200, 403, 404, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-membership-requests"]

  - id: "reject-membership"
    name: "Отклонение заявки на вступление"
    method: "POST"
    path: "/api/membership/requests/{id}/reject"
    role: "uk"
    request:
      path:
        id: 1
      headers:
        Content-Type: "application/json"
      body:
        reason: "Тестовое отклонение"
    expected:
      statusCodes: [200, 400, 403, 404, 409]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: false
    dependsOn: ["get-membership-requests"]

cleanup:
  - id: "cleanup-request"
    method: "DELETE"
    path: "/api/requests/{id}"
    role: "user"
    request:
      path:
        id: "${requestId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000

  - id: "cleanup-news"
    method: "DELETE"
    path: "/api/news/{id}"
    role: "user"
    request:
      path:
        id: "${newsId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000

  - id: "cleanup-announcement"
    method: "DELETE"
    path: "/api/announcements/{id}"
    role: "uk"
    request:
      path:
        id: "${announcementId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000