<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Умный дом — заявки жителей</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1a1a1a; --muted: #6b7280; --accent: #2f6fed; --danger: #d7263d; --ok: #1a9c4b; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 -apple-system, system-ui, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 12px 16px; background: var(--card); border-bottom: 1px solid #e5e7eb; font-weight: 600; }
    .screen { display: none; } .screen.active { display: block; }
    #map { height: 55vh; min-height: 300px; }
    .panel { padding: 12px 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--danger); font-size: 14px; margin-top: 6px; }
    .ok { color: var(--ok); font-size: 14px; margin-top: 6px; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: var(--text); }
    button:disabled { opacity: .5; }
    input, select, textarea { font: inherit; width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .row > button { flex: 0 0 auto; }
    .search { padding: 8px 16px; background: var(--card); }
    .results button { display: block; width: 100%; text-align: left; background: #fff; color: var(--text); border: 1px solid #e5e7eb; margin-top: 6px; }
    .request { border-top: 1px solid #eee; padding: 10px 0; }
    .request:first-child { border-top: 0; }
    .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; margin-left: 6px; }
    a.link { color: var(--accent); cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <header>Умный дом · заявки жителей</header>

  <section id="screen-map" class="screen">
    <div class="search">
      <div class="row">
        <input id="search" placeholder="Адрес, например: Казань, Волгоградская 5" autocomplete="off">
        <button id="search-btn">Найти</button>
        <button id="locate-btn" class="secondary" title="Моё местоположение">📍</button>
      </div>
      <div id="search-results" class="results"></div>
    </div>
    <div id="map"></div>
    <div class="panel">
      <div id="house-card" class="card muted">Нажмите на свой дом на карте или найдите адрес</div>
    </div>
  </section>

  <section id="screen-apartment" class="screen">
    <div class="panel">
      <div class="card">
        <div id="apt-house" style="font-weight:600"></div>
        <div id="apt-info" class="muted"></div>
        <label for="apartment">Номер квартиры</label>
        <input id="apartment" inputmode="numeric" placeholder="например, 27">
        <label>Вы владелец или арендатор?</label>
        <div class="row">
          <button id="type-owner" class="secondary">Владелец</button>
          <button id="type-tenant" class="secondary">Арендатор</button>
        </div>
        <div id="apt-error" class="error"></div>
        <div class="row" style="margin-top:12px">
          <button id="apt-back" class="secondary">← Карта</button>
          <button id="apt-save">Сохранить</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-home" class="screen">
    <div class="panel">
      <div class="card">
        <div id="home-address" style="font-weight:600"></div>
        <div id="home-apartment" class="muted"></div>
        <a id="change-house" class="link">Сменить дом</a>
      </div>
      <div id="announcements-card" class="card" style="display:none">
        <div style="font-weight:600">Объявления дома</div>
        <div id="announcements" class="muted">Загрузка…</div>
      </div>
      <div class="card">
        <div style="font-weight:600">Новая заявка</div>
        <label for="category">Категория</label>
        <select id="category"></select>
        <label for="description">Опишите проблему</label>
        <textarea id="description" placeholder="Что случилось, где, с какого времени"></textarea>
        <label><input type="checkbox" id="emergency" style="width:auto"> Аварийная — сразу в УК, без сбора подписей</label>
        <div id="req-error" class="error"></div>
        <div id="req-ok" class="ok"></div>
        <button id="req-send" style="margin-top:10px;width:100%">Отправить заявку</button>
      </div>
      <div class="card">
        <div style="font-weight:600">Заявки дома</div>
        <div id="requests" class="muted">Загрузка…</div>
      </div>
      <div class="card">
        <div style="font-weight:600">Новость соседям</div>
        <div class="muted">Например, позвать в гости или поделиться новостью — не для проблем дома</div>
        <label for="news-title">Заголовок</label>
        <input id="news-title" placeholder="Например: Зову на Новый год">
        <label for="news-description">Текст</label>
        <textarea id="news-description" placeholder="О чём хотите рассказать соседям"></textarea>
        <label for="news-contact">Как с вами связаться</label>
        <input id="news-contact" placeholder="Телефон, ссылка на профиль…">
        <div id="news-error" class="error"></div>
        <div id="news-ok" class="ok"></div>
        <button id="news-send" style="margin-top:10px;width:100%">Опубликовать</button>
      </div>
      <div class="card">
        <div style="font-weight:600">Новости соседей</div>
        <div id="news-list" class="muted">Загрузка…</div>
      </div>
    </div>
  </section>

  <section id="screen-error" class="screen">
    <div class="panel"><div id="fatal" class="card error"></div></div>
  </section>

  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
